<!DOCTYPE html>
<html lang="en">
<head>

<title>Heat Advisory: A Public Health Case File</title>
<style>

  --bg:#f4f1ec; --card:#ffffff; --line:#e3ddd3; --paper:#fffdf9;

}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;font-size:17px}

/* header */
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.brand{font-weight:800;color:var(--navy);font-size:18px;letter-spacing:.01em}

.timeline{display:flex;gap:4px;flex:1 1 420px;list-style:none;margin:0;padding:0}
.timeline li{flex:1;text-align:center;font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:#8a8378;padding-top:10px;position:relative}

.meter{display:flex;gap:8px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--navy);white-space:nowrap}
.chip b{color:var(--heat-dark)}
.chip.bump{animation:bump .6s}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px}
.stack>*+*{margin-top:14px}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:12px 22px;font-weight:600;background:var(--heat);color:#fff}

.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}

.avatar{position:relative;flex:0 0 auto;width:56px;height:56px;border-radius:50%;overflow:hidden;background:var(--navy);display:grid;place-items:center;color:#fff;font-weight:700;font-size:18px;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}

.chart svg{width:100%;max-width:460px;height:auto;display:block}

.chart-summary{font-size:14px;color:var(--muted);margin-top:8px}
table.data{width:100%;border-collapse:collapse;font-size:15px}

table.data td.num,table.data th.num{text-align:right}
.table-scroll{overflow-x:auto}

/* questions */
.qbox{border-top:2px solid var(--line);padding-top:16px}
.qlabel{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.options{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.opt{text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start}

.opt.tried{background:#faf6f2;border-color:#e2c7b5;color:#7a6a5c}

.cost{display:inline-block;margin-top:8px;font-size:13px;font-weight:700;color:var(--warn);background:#fff;border:1px solid #f3cfb6;border-radius:999px;padding:2px 10px}

.real a{color:var(--focus)}

/* builder & sort */
.group{margin-top:14px}

.pill{border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:15px;text-align:left}

.pill.right{border-color:var(--good);background:var(--good-soft)}
.statement{margin-top:16px;background:var(--paper);border:1px dashed #cdbfae;border-radius:12px;padding:14px 16px;font-size:16px}

.stat b{display:block;font-size:26px}

.sources summary{cursor:pointer;font-weight:700;color:var(--navy)}
.sources ol{padding-left:20px}

.src-list{padding-left:22px;margin:0}
.src-list li{margin-bottom:16px}
.src-list .apa{padding-left:1.5em;text-indent:-1.5em;margin-bottom:4px}
.src-list .apa a{color:var(--focus);word-break:break-word}

.inline-link{background:none;border:0;padding:0;color:var(--focus);text-decoration:underline;font-size:inherit}
.done-note{margin-top:16px;background:var(--good-soft);color:var(--good);font-weight:600;padding:12px 16px;border-radius:10px}
.guide{display:flex;gap:16px;align-items:flex-start}
.bubble{background:#faf8f4;border:1px solid var(--line);border-radius:4px var(--radius) var(--radius) var(--radius);padding:14px 16px;flex:1}

.role{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}

@media (max-width:640px){ .mail-from .addr{display:block} .mail-body,.mail-actions{padding-left:16px} .mail-head{flex-wrap:wrap} .mail-date{width:100%;padding-left:52px} }
.screen{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

@media print{
  body{background:#fff} .topbar .link-btn,.statusbar,.actions{display:none!important}
  .card{box-shadow:none;border:0}
}
</style>

const KEY = "heatAdvisoryCase_v1";
const app = document.getElementById("app");
let state = load() || fresh();
function fresh(){ return { started:false, step:0, days:0, visits:0, firstTry:{}, done:false }; }
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)); }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle = a => { const r=a.slice(); for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];} return r; };

function avatar(key, size){
  const p = PEOPLE[key]; const cls = "avatar" + (size ? " "+size : "");
  const img = p.image ? `<img src="${esc(p.image)}" alt="" onerror="imgFallback(this)">` : "";
  return `<div class="${cls}" style="background:${p.color}"><span aria-hidden="true" style="position:absolute">${esc(p.initials)}</span>${img}</div>`;
}
function person(key){
  const p = PEOPLE[key];
  return `<div class="person">${avatar(key)}<div class="who">${esc(p.name)}<small>${esc(p.sub)}</small></div></div>`;
}
function realNote(r){
  if(!r) return "";
  const s = SOURCES[r.s];
  return `<div class="real"><b>Real-world data:</b> ${esc(r.t)} <a href="${esc(s.u)}" target="_blank" rel="noopener">Source [${r.s+1}]</a></div>`;
}
function costTag(c){
  if(!c || (!c.days && !c.visits)) return "";
  const parts=[]; if(c.days) parts.push(`+${c.days} day${c.days>1?"s":""}`); if(c.visits) parts.push(`+${c.visits} ER visit${c.visits>1?"s":""}`);
  return `<span class="cost">⏱ ${parts.join(" · ")}</span>`;
}
function applyCost(c){
  if(!c) return;
  state.days += c.days||0; state.visits += c.visits||0; save(); updateStatus(true);
}

/* ---------- documents ---------- */
let uid = 0;
function player(src, label){
  if(!src) return "";
  return `<div class="player" data-src="${esc(src)}" hidden>
    <button type="button" class="pl-btn" aria-label="Play ${esc(label)}"><span aria-hidden="true">▶</span></button>
    <input type="range" class="pl-seek" min="0" max="1000" value="0" aria-label="Seek ${esc(label)}">
    <span class="pl-time">0:00</span></div>`;
}
function chartSVG(c){
  const max = Math.max(...c.bars.map(b=>b.v), c.expected)+1, W=360, H=170, pad=30, bw=(W-pad*2)/c.bars.length;
  const y = v => H-24 - (v/max)*(H-44);
  const bars = c.bars.map((b,i)=>{ const x=pad+i*bw+bw*0.2, w=bw*0.6; return `<rect x="${x}" y="${y(b.v)}" width="${w}" height="${H-24-y(b.v)}" rx="4" fill="#d9591f"/><text x="${x+w/2}" y="${y(b.v)-6}" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">${b.v}</text><text x="${x+w/2}" y="${H-8}" text-anchor="middle" font-size="12" fill="#5b6574">${esc(b.l)}</text>`; }).join("");
  const ey = y(c.expected);
  return `<div class="chart"><div class="chart-title">${esc(c.title)}</div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.summary)}"><line x1="${pad}" x2="${W-pad}" y1="${H-24}" y2="${H-24}" stroke="#cfc6b8"/>${bars}
    <line x1="${pad}" x2="${W-pad}" y1="${ey}" y2="${ey}" stroke="#1b2a41" stroke-dasharray="5 4" stroke-width="1.5"/></svg>
    <span class="legend"><i></i> Expected for early July (about ${c.expected} per day)</span>
    <p class="chart-summary">${esc(c.summary)}</p></div>`;
}

/* images: if not next to index.html, try the source/ folder */
function imgFallback(el, isPhoto){
  const tried = +(el.dataset.tries||0);
  const base = el.getAttribute("src").replace(/^(source|Source)\//,"");
  const alts = ["source/"+base, "Source/"+base];
  if(tried < alts.length){ el.dataset.tries = tried+1; el.src = alts[tried]; return; }
  if(isPhoto) el.closest("figure").classList.add("missing"); else el.remove();
}

/* audio players: show only when the file loads */
let current = null;
const fmt = t => isFinite(t) ? `${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,"0")}` : "0:00";
function initPlayers(root){
  root.querySelectorAll(".player").forEach(el => {
    const a = new Audio(); a.preload = "metadata";
    const btn = el.querySelector(".pl-btn"), seek = el.querySelector(".pl-seek"), time = el.querySelector(".pl-time");
    a.addEventListener("loadedmetadata", () => { el.hidden = false; time.textContent = fmt(a.duration); });
    a.addEventListener("timeupdate", () => { if(a.duration){ seek.value = Math.round(a.currentTime/a.duration*1000); time.textContent = `${fmt(a.currentTime)} / ${fmt(a.duration)}`; } });
    a.addEventListener("ended", () => { btn.firstElementChild.textContent = "▶"; btn.setAttribute("aria-label", btn.getAttribute("aria-label").replace("Pause","Play")); });
    btn.onclick = () => {
      if(a.paused){ if(current && current!==a) current.pause(); current = a; a.play(); btn.firstElementChild.textContent = "❚❚"; btn.setAttribute("aria-label", btn.getAttribute("aria-label").replace("Play","Pause")); }
      else { a.pause(); btn.firstElementChild.textContent = "▶"; btn.setAttribute("aria-label", btn.getAttribute("aria-label").replace("Pause","Play")); }
    };
    a.addEventListener("pause", () => { btn.firstElementChild.textContent = "▶"; });
    seek.oninput = () => { if(a.duration) a.currentTime = seek.value/1000*a.duration; };
    /* try audio/ first, then "source audio/", plus the original voicemail file name */
    const file = el.dataset.src.split("/").pop();
    const names = [file]; if(file==="02-voicemail-np.mp3") names.push("02-voicemail-n.mp3");
    const tries = [];
    ["audio/","source/audio/","Source/audio/","source audio/","source%20audio/"].forEach(f => names.forEach(n => tries.push(f+n)));
    let i = 0;
    a.addEventListener("error", () => { i++; if(i < tries.length) a.src = tries[i]; });
    a.src = tries[0];
  });
}

/* multiple choice */
function mcQ(S, box){
  const Q = S.q, L="ABCD"; const order = shuffle(Q.options.map((_,k)=>k));
  box.innerHTML = `<div class="qlabel">Decision</div><h3 id="qp">${esc(Q.prompt)}</h3>
    <div class="options" role="group" aria-labelledby="qp">${order.map((k,pos)=>`<button type="button" class="opt" data-k="${k}"><span class="dot" aria-hidden="true">${L[pos]}</span><span>${esc(Q.options[k].text)}</span></button>`).join("")}</div>
    <div class="feedback" id="fb" aria-live="polite"></div>`;
  let tries=0; const fb = box.querySelector("#fb");
  box.querySelectorAll(".opt").forEach(btn => btn.onclick = () => {
    const o = Q.options[+btn.dataset.k]; tries++;
    if(o.correct){
      markFirst(S, tries===1);
      btn.classList.add("correct"); box.querySelectorAll(".opt").forEach(b=>b.disabled=true);
      fb.innerHTML = `<div class="fb-card good"><div class="fb-title">${esc(PEOPLE.director.name)} · ${tries===1?"Good call":"That's the stronger move"}</div><p style="margin:0">${esc(o.fb)}</p>${realNote(o.real)}</div>`;
      nextBtn(box, S);
    } else {
      markFirst(S, false);
      btn.classList.add("tried"); btn.disabled = true; applyCost(o.cost);
      fb.innerHTML = `<div class="fb-card try"><div class="fb-title">What happens</div><p style="margin:0">${esc(o.fb)}</p>${costTag(o.cost)}<p style="margin:8px 0 0;font-size:14px">Choose again.</p></div>`;
    }
  });
}

/* pick N */
function pickQ(S, box){
  const Q = S.q; let sel = new Set(); const order = shuffle(Q.options);
  box.innerHTML = `<div class="qlabel">Choose ${Q.n}</div><h3 id="qp">${esc(Q.prompt)}</h3>
    <div class="options" role="group" aria-labelledby="qp">${order.map(o=>`<button type="button" class="opt" data-id="${o.id}" aria-pressed="false"><span class="dot" aria-hidden="true">✓</span><span><strong>${esc(o.label)}</strong><span class="desc">${esc(o.desc)}</span></span></button>`).join("")}</div>
    <div class="counter-note" id="cnt">0 of ${Q.n} selected</div>
    <div class="actions"><button class="btn secondary" id="submit" type="button" disabled>Submit</button></div>
    <div class="feedback" id="fb" aria-live="polite"></div>`;
  const cnt = box.querySelector("#cnt"), sub = box.querySelector("#submit"), fb = box.querySelector("#fb");
  const refresh = () => { cnt.textContent = `${sel.size} of ${Q.n} selected`; sub.disabled = sel.size !== Q.n;
    box.querySelectorAll(".opt").forEach(b=>{ const on = sel.has(b.dataset.id); b.classList.toggle("sel", on); b.setAttribute("aria-pressed", String(on)); b.classList.remove("tried","correct"); }); };
  box.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const id = b.dataset.id;
    if(sel.has(id)) sel.delete(id); else if(sel.size < Q.n) sel.add(id);
    refresh(); fb.innerHTML = "";
  });
  sub.onclick = () => {
    const picked = Q.options.filter(o=>sel.has(o.id));
    const keys = Q.options.filter(o=>o.key);
    const ok = keys.every(k=>sel.has(k.id));
    markFirst(S, ok);
    const list = `<ul>${picked.map(o=>`<li><strong>${esc(o.label)}:</strong> ${esc(o.fb)}</li>`).join("")}</ul>`;
    box.querySelectorAll(".opt").forEach(b=>{ const o = Q.options.find(x=>x.id===b.dataset.id); if(sel.has(o.id)) b.classList.add(o.key||o.ok ? "correct":"tried"); });
    if(ok){
      box.querySelectorAll(".opt").forEach(b=>b.disabled=true); sub.disabled = true;
      fb.innerHTML = `<div class="fb-card good"><div class="fb-title">${esc(PEOPLE.director.name)} · Solid choices</div>${Q.fb?`<p style="margin:0">${esc(Q.fb)}</p>`:""}${list}</div>`;
      nextBtn(box, S);
    } else {
      applyCost(Q.missCost);
      fb.innerHTML = `<div class="fb-card try"><div class="fb-title">What happens</div><p style="margin:0">${esc(Q.missFb)}</p>${list}${costTag(Q.missCost)}<p style="margin:8px 0 0;font-size:14px">Change your selections and submit again.</p></div>`;
    }
  };
}

/* sentence builder */
function builderQ(S, box){
  const Q = S.q; const choice = Q.groups.map(()=>null);
  const shuffled = Q.groups.map(g => shuffle(g.options.map((_,k)=>k)));
  const statement = () => Q.template.map(t => { const m = t.match(/^\{(\d)\}$/); if(!m) return esc(t); const g=+m[1];
    return choice[g]===null ? `<span class="blank">${esc(Q.groups[g].label.toLowerCase())}</span>` : `<span class="filled">${esc(Q.groups[g].options[choice[g]].text)}</span>`; }).join("");
  box.innerHTML = `<div class="qlabel">Build it</div><h3>${esc(Q.prompt)}</h3>
    ${Q.groups.map((g,gi)=>`<div class="group"><div class="group-label" id="g${gi}">${esc(g.label)}</div><div class="pills" role="group" aria-labelledby="g${gi}">${shuffled[gi].map(k=>`<button type="button" class="pill" data-g="${gi}" data-k="${k}" aria-pressed="false">${esc(g.options[k].text)}</button>`).join("")}</div></div>`).join("")}
    <div class="statement" id="stmt" aria-live="polite">${statement()}</div>
    <div class="actions"><button class="btn secondary" id="submit" type="button" disabled>Check statement</button></div>
    <div class="feedback" id="fb" aria-live="polite"></div>`;
  const sub = box.querySelector("#submit"), fb = box.querySelector("#fb"), stmt = box.querySelector("#stmt");
  box.querySelectorAll(".pill").forEach(p => p.onclick = () => {
    const g=+p.dataset.g, k=+p.dataset.k; choice[g]=k;
    box.querySelectorAll(`.pill[data-g="${g}"]`).forEach(x=>{ x.setAttribute("aria-pressed", String(+x.dataset.k===k)); x.classList.remove("wrong","right"); });
    stmt.innerHTML = statement(); sub.disabled = choice.some(c=>c===null); fb.innerHTML="";
  });
  sub.onclick = () => {
    const wrong = Q.groups.map((g,gi)=>({g,gi})).filter(({g,gi})=>!g.options[choice[gi]].correct);
    markFirst(S, wrong.length===0);
    Q.groups.forEach((g,gi)=>{ const p = box.querySelector(`.pill[data-g="${gi}"][data-k="${choice[gi]}"]`); p.classList.add(g.options[choice[gi]].correct?"right":"wrong"); });
    if(!wrong.length){
      box.querySelectorAll(".pill").forEach(p=>p.disabled=true); sub.disabled=true;
      fb.innerHTML = `<div class="fb-card good"><div class="fb-title">${esc(PEOPLE.director.name)} · Ready for the briefing</div><p style="margin:0">${esc(Q.fb)}</p>${realNote(Q.real)}</div>`;
      nextBtn(box, S);
    } else {
      applyCost(Q.cost);
      fb.innerHTML = `<div class="fb-card try"><div class="fb-title">Check the evidence</div><ul>${wrong.map(({g,gi})=>`<li><strong>${esc(g.label)}:</strong> ${esc(g.options[choice[gi]].fb)}</li>`).join("")}</ul>${costTag(Q.cost)}</div>`;
    }
  };
}

/* sort */
function sortQ(S, box){
  const Q = S.q; const ans = Q.items.map(()=>null); const order = shuffle(Q.items.map((_,k)=>k));
  box.innerHTML = `<div class="qlabel">Sort</div><h3>${esc(Q.prompt)}</h3>
    <div>${order.map(k=>`<div class="sort-row" data-row="${k}"><div class="item">${esc(Q.items[k].text)}<small hidden></small></div>
      <div class="seg" role="group" aria-label="${esc(Q.items[k].text)}">${Q.cats.map((c,ci)=>`<button type="button" data-k="${k}" data-c="${ci}" aria-pressed="false">${esc(c)}</button>`).join("")}</div></div>`).join("")}</div>
    <div class="actions"><button class="btn secondary" id="submit" type="button" disabled>Check</button></div>
    <div class="feedback" id="fb" aria-live="polite"></div>`;
  const sub = box.querySelector("#submit"), fb = box.querySelector("#fb");
  box.querySelectorAll(".seg button").forEach(b => b.onclick = () => {
    const k=+b.dataset.k, c=+b.dataset.c; ans[k]=c;
    const row = box.querySelector(`[data-row="${k}"]`); row.classList.remove("wrong","right"); row.querySelector("small").hidden = true;
    row.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed", String(+x.dataset.c===c)));
    sub.disabled = ans.some(a=>a===null); fb.innerHTML="";
  });
  sub.onclick = () => {
    let wrong=0;
    Q.items.forEach((it,k)=>{ const row = box.querySelector(`[data-row="${k}"]`); const ok = ans[k]===it.cat; row.classList.add(ok?"right":"wrong");
      const sm = row.querySelector("small"); if(!ok){ wrong++; sm.hidden=false; sm.textContent = "Not quite. Think about whether this is the cause, the person, or the surroundings."; } });
    markFirst(S, wrong===0);
    if(!wrong){
      box.querySelectorAll(".seg button").forEach(b=>b.disabled=true); sub.disabled=true;
      fb.innerHTML = `<div class="fb-card good"><div class="fb-title">${esc(PEOPLE.director.name)} · All sorted</div><p>${esc(Q.fb)}</p><ul>${Q.items.map(it=>`<li><strong>${esc(it.text)}</strong> (${esc(Q.cats[it.cat])}): ${esc(it.fb)}</li>`).join("")}</ul>${realNote(Q.real)}</div>`;
      nextBtn(box, S);
    } else {
      applyCost(Q.cost);
      fb.innerHTML = `<div class="fb-card try"><div class="fb-title">${wrong} to rethink</div><p style="margin:0">Agent = what causes harm. Host = the person's body. Environment = conditions around the person, including physical, social, and economic ones.</p>${costTag(Q.cost)}</div>`;
    }
  };
}

      <div class="stat"><b>${firsts} / ${STEPS.length}</b><span>Strongest call on the first try</span></div>
      <div class="stat"><b>${state.days}</b><span>Days lost to weaker calls</span></div>
      <div class="stat"><b>${state.visits}</b><span>Extra ER visits while deciding</span></div>
    </div>
    <p><strong>${esc(DEBRIEF.closing)}</strong></p>
    <div class="aar">${rows}</div>
    <p class="muted" style="font-size:14px">Cedar Valley County, its people, and its case counts are fictional. The real-world data notes come from the sources on the Sources page.</p>
    <div class="done-note" role="status">✓ Continue in your lesson when you're ready.</div>
    <div class="actions">
      <button class="btn secondary" id="print" type="button">Print or save this review</button>
      <button class="btn ghost" id="srcBtn2" type="button">Sources</button>
      <button class="btn ghost" id="again" type="button">Run the case again</button>
    </div>
  </section>`);
  document.getElementById("print").onclick = () => window.print();
  document.getElementById("again").onclick = restart;
  document.getElementById("srcBtn2").onclick = showSources;
}

function resume(){ if(!state.started) showIntro(); else if(state.done || state.step>=STEPS.length) showDebrief(); else showStep(); }
function showSources(){
  render(`<section class="card stack">
    <div class="eyebrow">Sources</div>
    <h2>Where the real-world data comes from</h2>
    <p>Cedar Valley County, the people in this case, and all case counts are <strong>fictional</strong> and were created for teaching. The patterns in the case and every "Real-world data" note are based on the sources below.</p>
    <ol class="src-list">${SOURCES.map((x,i)=>`<li id="src${i+1}"><p class="apa">${x.apa} <a href="${esc(x.u)}" target="_blank" rel="noopener">${esc(x.u)}</a></p><p class="used"><strong>Used for:</strong> ${esc(x.used)}</p></li>`).join("")}</ol>
    <p class="muted" style="font-size:14px">Web sources retrieved September 25, 2026. Citations follow APA 7th edition.</p>
    <div class="actions"><button class="btn" id="srcBack" type="button">← Back to the case</button></div>
  </section>`);
  document.getElementById("srcBack").onclick = resume;
}

function restart(){ state = fresh(); save(); showIntro(); }
document.getElementById("sourcesBtn").onclick = showSources;
document.getElementById("restartBtn").onclick = () => { if(confirm("Start over? Your progress will be cleared.")) restart(); };

resume();
</script>
</body>
